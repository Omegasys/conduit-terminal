id = "default"
name = "Default"
version = "1.0.0"
description = "Conduit's standard balanced terminal theme."
author = "Conduit Project"
license = "GPL-3.0-or-later"

[colors]
background = "#111318"
foreground = "#E6EAF0"
cursor = "#E6EAF0"
selection_background = "#3A4050"
selection_foreground = "#FFFFFF"

black = "#17191F"
red = "#E05252"
green = "#62C554"
yellow = "#D9B44A"
blue = "#5B8DEF"
magenta = "#B875D1"
cyan = "#4FB3B3"
white = "#D7DBE2"

bright_black = "#4B515C"
bright_red = "#FF6B6B"
bright_green = "#7BE06D"
bright_yellow = "#F0D264"
bright_blue = "#78A5FF"
bright_magenta = "#D397EA"
bright_cyan = "#69D9D9"
bright_white = "#FFFFFF"

[ui]
border = "#3A4050"
active_border = "#6B7485"
tab_active = "#252A34"
tab_inactive = "#181B21"
status_bar = "#1B1F27"
sidebar = "#15181E"
menu = "#191D24"

[text]
font_size = 13
line_height = 1.2
bold = true
italic = true

[cursor]
style = "Block"
blink = true
blink_interval_ms = 500

[selection]
style = "Block"
