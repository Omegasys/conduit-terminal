# Conduit custom profile.
#
# This file is intended as a starting point for creating a custom profile.
# Uncomment and modify only the settings you want to override.

[application]
# confirm_close = true
# restore_session = false
# restore_workspace = true

[terminal]
# scrollback_lines = 10000
# cursor_style = "block"
# cursor_blink = true
# bell = "visual"
# bracketed_paste = true
# mouse_reporting = true

[shell]
# default = "auto"
# login_shell = true
# integration = true
# history_integration = true

[ui]
# show_menu_bar = true
# show_toolbar = true
# show_sidebar = true
# show_status_bar = true
# show_tab_bar = true
# show_command_palette = true
# animations = true
# compact_mode = false

[appearance]
# theme = "default"
# font_family = "monospace"
# font_size = 12.0
# ligatures = true

[rendering]
# backend = "auto"
# gpu_acceleration = true
# software_fallback = true
# vsync = true

[clipboard]
# enabled = true
# confirm_paste = false
# history_enabled = false
# allow_terminal_read = true
# allow_terminal_write = true
# redact_sensitive_data = true

[security]
# profile = "standard"
# sandbox = true
# untrusted_output_protection = true
# hyperlink_protection = true
# clipboard_protection = true
# plugin_permission_checks = true
# resource_validation = true
# payload_limits = true
# sensitive_data_redaction = true

[plugins]
# enabled = true
# require_manifest = true
# require_permissions = true
# sandbox = true
# auto_enable = false

[remote]
# enabled = true
# ssh_enabled = true
# remote_clipboard = false
# remote_notifications = false

[diagnostics]
# enabled = true
# log_level = "info"
# flow_view = false
# event_history = true

[accessibility]
# screen_reader = "auto"
# high_contrast = false
# large_text = false
# focus_indicators = true
# reduced_motion = false
# keyboard_navigation = true

[experimental]
# enabled = false
