# Conduit default profile.
# Intended for normal everyday use.

[application]
confirm_close = true
restore_session = false
restore_workspace = true

[terminal]
scrollback_lines = 10000
cursor_style = "block"
cursor_blink = true
bell = "visual"
bracketed_paste = true
mouse_reporting = true

[shell]
default = "auto"
login_shell = true
integration = true
history_integration = true

[ui]
show_menu_bar = true
show_toolbar = true
show_sidebar = true
show_status_bar = true
show_tab_bar = true
show_command_palette = true
animations = true

[appearance]
theme = "default"
font_family = "monospace"
font_size = 12.0
ligatures = true

[rendering]
backend = "auto"
gpu_acceleration = true
software_fallback = true
vsync = true

[clipboard]
enabled = true
confirm_paste = false
history_enabled = false
redact_sensitive_data = true

[security]
profile = "standard"
sandbox = true
untrusted_output_protection = true
hyperlink_protection = true
clipboard_protection = true
plugin_permission_checks = true
resource_validation = true

[plugins]
enabled = true
require_manifest = true
require_permissions = true
sandbox = true
auto_enable = false

[diagnostics]
enabled = true
log_level = "info"

[accessibility]
screen_reader = "auto"
high_contrast = false
large_text = false
reduced_motion = false
